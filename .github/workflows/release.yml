name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1e # v7.0.1
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
        with:
          version: 10.15.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - name: Verify tag and install
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          package_version=$(node -p "require('./package.json').version")
          test "$RELEASE_TAG" = "v$package_version"
          pnpm install --frozen-lockfile
      - run: pnpm validate
      - name: Upload cross-platform candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cli-${{ matrix.os }}
          path: release/
          if-no-files-found: error

  publish:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: cli-ubuntu-latest
          path: release
      - name: Attest CLI archive provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: release/ingestron-cli-0.3.0-preview.1.tgz
      - name: Attest CLI archive SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: release/ingestron-cli-0.3.0-preview.1.tgz
          sbom-path: release/ingestron-cli-0.3.0-preview.1.spdx.json
      - name: Create preview release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            release/ingestron-cli-0.3.0-preview.1.tgz \
            release/ingestron-cli-0.3.0-preview.1.spdx.json \
            release/provenance.json \
            release/SHA256SUMS \
            --verify-tag \
            --prerelease \
            --repo "$GITHUB_REPOSITORY" \
            --title "Ingestron CLI 0.3.0 preview 1" \
            --notes "Unsupported customer-managed Azure and ADF technical preview. Verify SHA256SUMS and read SECURITY.md, LICENSING.md, and the Azure runtime licence before use. npm publication is intentionally deferred."
